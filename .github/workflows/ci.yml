name: on-policy-distillation-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The workflow guide keeps one workflow and one job. This job both runs the
  # release gate and enforces the GNN upstream conformance; the exact name makes
  # that conformance visible in the check list instead of hiding it in steps.
  #
  # Check steps invoke `scripts/gate.py`, which owns their command argv.
  # `python scripts/gate.py all` runs the same arms in the same order locally.
  release-gate:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Job-level so the conformance tests inside the `full` arm resolve the same
      # pinned checkout the `gnn` arm provisions. An explicit selection turns an
      # unavailable or divergent checkout into a failure instead of a skip.
      ON_POLICY_DISTILLATION_GNN_ROOT: ${{ runner.temp }}/gnn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The typography contract renders the combined .tex and fails closed when
      # pandoc is absent; the hosted image does not ship it.
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.14"
      # One environment for every arm. `--locked` already refuses an out-of-date
      # uv.lock, so no separate `uv lock --check` step is needed.
      - run: uv sync --locked --extra dev
      # Static checks: ruff plus a byte-compile of src, scripts, and tests.
      - run: uv run --extra dev python scripts/gate.py lint
      # Relative-link check over tracked Markdown plus the doc-contract tests.
      - run: uv run --extra dev python scripts/gate.py docs
      # Fetch the revision pinned in gnn/upstream.json, install the pinned
      # parser's dependencies into its own Python 3.12 environment, run the
      # estate reader (gnn.importers) against that revision, and run the
      # conformance + parser tests. A dead pin fails here, before the suite, and
      # a green run is evidence the pin works.
      - run: uv run --extra dev python scripts/gate.py gnn
      # The suite is not self-contained: the gate tests and the manuscript
      # checks read the generated artifact tree, so a clean checkout has to
      # build it first. The chain is bounded and convergent and runs
      # `scripts/validate_outputs.py` itself.
      - run: uv run --extra dev python scripts/gate.py chain
      # Release gate: the whole suite under coverage with the 90% floor.
      - run: uv run --extra dev python scripts/gate.py full
